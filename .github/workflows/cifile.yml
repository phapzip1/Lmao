name: CI

# Flow: milestone branch (m0, m1, ...) -> PR into dev -> PR from dev into main.
# Runs on every PR into dev or main (checked before merging) and on pushes to them (checked after).
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, preset: windows-debug }
          - { os: windows-latest, preset: windows-release }
          - { os: ubuntu-latest,  preset: linux-debug }

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libwayland-dev libxkbcommon-dev xorg-dev

      - name: Fetch prebuilt tools (slangc)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -ExecutionPolicy Bypass -File scripts/setup.ps1
          else
            scripts/setup.sh
          fi

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Headless smoke test: null RHI backend + headless platform (runners have no GPU, and the
      # Linux one has no display). Exercises startup, resource creation, ImGui, the frame loop
      # and shutdown, where the null backend asserts on misuse and leaks (Debug builds).
      - name: Run sandbox headless (100 frames)
        shell: bash
        run: |
          exe=build/${{ matrix.preset }}/game/sandbox/lmao_sandbox
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe" --null --frames 100

      - name: Upload sandbox logs and crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-logs-${{ matrix.preset }}
          path: |
            logs/
            crashes/
          if-no-files-found: ignore
